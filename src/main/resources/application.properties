# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Database (MySQL)
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_travel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=root
spring.datasource.password=purswani3
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false


spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:smarttravel_jwt_secret_key_2026_minimum_32_characters_required_here}
jwt.expiration=${JWT_EXPIRATION:86400000}