<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartTravel — Explore India</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========== NAVBAR ========== -->
  <header class="navbar">
    <div class="nav-brand">
      <span class="brand-icon">✈</span>
      <span class="brand-name">SmartTravel</span>
    </div>

    <div class="nav-center">
      <input type="text" id="searchInput" placeholder="Search city, state..." />
      <button id="searchBtn" class="btn-primary">Search</button>
      <button id="showAllBtn" class="btn-outline">All Cities</button>
    </div>

    <div class="nav-right">
      <button id="themeToggle" class="btn-icon" title="Toggle Theme">🌙</button>

      <div id="guestButtons">
        <button id="openLoginBtn" class="btn-outline">Login</button>
        <button id="openRegisterBtn" class="btn-primary">Register</button>
      </div>

      <div id="userPanel" style="display:none">
        <span id="userGreeting" class="user-greeting"></span>
        <button id="favDashboardBtn" class="btn-outline">❤ My Favourites</button>
        <button id="logoutBtn" class="btn-danger">Logout</button>
      </div>
    </div>
  </header>

  <!-- ========== CATEGORY FILTERS ========== -->
  <div class="filter-bar">
    <button class="chip active" onclick="filterCategory('ALL', this)">🗺 All</button>
    <button class="chip" onclick="filterCategory('MOUNTAINS', this)">⛰ Mountains</button>
    <button class="chip" onclick="filterCategory('BEACHES', this)">🏖 Beaches</button>
    <button class="chip" onclick="filterCategory('HERITAGE', this)">🏛 Heritage</button>
    <button class="chip" onclick="filterCategory('RELIGIOUS', this)">🛕 Religious</button>
    <button class="chip" onclick="filterCategory('FOOD_STREET', this)">🍜 Food & Street</button>
    <button class="chip" onclick="filterCategory('ADVENTURE', this)">🧗 Adventure</button>
    <button class="chip" onclick="filterCategory('PARTY', this)">🎉 Party</button>
    <button class="chip gem-chip" onclick="filterHiddenGems(this)">💎 Hidden Gems</button>
  </div>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="container">
    <div id="cityContainer" class="city-grid"></div>
  </main>

  <!-- ========== FAVOURITES DASHBOARD ========== -->
  <div id="favDashboard" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <h2>❤ My Favourites</h2>
        <button class="modal-close" onclick="closeDashboard()">✕</button>
      </div>
      <div id="favList" class="fav-list"></div>
    </div>
  </div>

  <!-- ========== LOGIN MODAL ========== -->
  <div id="loginModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Login</h2>
        <button class="modal-close" onclick="closeModal('loginModal')">✕</button>
      </div>
      <div class="modal-body">
        <input type="text" id="loginUsername" placeholder="Username" class="form-input" />
        <input type="password" id="loginPassword" placeholder="Password" class="form-input" />
        <div id="loginError" class="error-msg"></div>
        <button onclick="doLogin()" class="btn-primary full-width">Login</button>
        <p class="switch-text">
          Don't have an account?
          <span class="link-text" onclick="switchToRegister()">Register</span>
        </p>
      </div>
    </div>
  </div>

  <!-- ========== REGISTER MODAL ========== -->
  <div id="registerModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Create Account</h2>
        <button class="modal-close" onclick="closeModal('registerModal')">✕</button>
      </div>
      <div class="modal-body">
        <input type="text" id="regUsername" placeholder="Username" class="form-input" />
        <input type="email" id="regEmail" placeholder="Email" class="form-input" />
        <input type="password" id="regPassword" placeholder="Password" class="form-input" />
        <div id="registerError" class="error-msg"></div>
        <button onclick="doRegister()" class="btn-primary full-width">Create Account</button>
        <p class="switch-text">
          Already have an account?
          <span class="link-text" onclick="switchToLogin()">Login</span>
        </p>
      </div>
    </div>
  </div>

  <!-- ========== TOAST ========== -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
